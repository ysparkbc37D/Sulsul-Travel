/* 독립 디자인 시안. 실제 여행 저장소·외부 API·실시간 동기화에 접근하지 않는다. */
const scenarios={
 taiwan:{title:'대만, 조금 느리게',code:'TAIWAN',dates:'2026.04.09 — 04.12',day:'4월 10일 금요일',region:'북동부 · 지우펀',lead:'도시의 리듬에서,\n산마을의 저녁으로.',summary:'타이베이에서 시작해 북동부를 돌아오는 여정. 꼭 하고 싶은 경험을 먼저 고르고, 나머지는 여유롭게 조정해요.',blocks:[{title:'타이베이에 도착하다',date:'4.09–10',nights:'도착 · 1박',stay:'도심 숙소',experiences:'공항 이동 · 늦은 체크인 · 충분한 휴식',detail:'심야 도착 다음 날의 출발 여유를 먼저 잡아요.'},{title:'북동부를 지나 지우펀으로',date:'4.10–11',nights:'거점 이동 · 1박',stay:'지우펀 숙소',experiences:'해안 산책 · 작은 마을 · 골목의 저녁',detail:'숙소 체크인은 고정하고 관광 순서는 유연하게 둬요.'},{title:'타이베이에서 마무리',date:'4.11–12',nights:'도심 · 1박',stay:'도심 숙소',experiences:'실내 관람 · 식도락 · 귀국',detail:'귀국 이동과 차량 반납 시간을 먼저 확보해요.'}],places:['숙소에서 출발','스펀 산책','해안 전망 산책','지우펀 숙소 체크인'],transit:'도시 이동 · 렌터카 / 마지막 도보 확인'},
 cebu:{title:'세부, 함께 쉬는 일주일',code:'CEBU',dates:'2023.09.10 — 09.16',day:'9월 12일 화요일',region:'북부 리조트',lead:'빈칸도 여행의\n좋은 계획이니까.',summary:'장거리 이동은 줄이고 리조트와 시내를 나눠 머물러요. 일행의 휴식과 함께할 시간을 중심에 둡니다.',blocks:[{title:'도착과 북부 이동',date:'9.10–11',nights:'심야 도착',stay:'북부 숙소로 이동',experiences:'공항 도착 · 예약 차량 · 짐 보관',detail:'인원과 수하물, 심야 도착을 함께 고려해요.'},{title:'북부에서 충분히 쉬기',date:'9.11–13',nights:'리조트 · 2박',stay:'가족형 객실',experiences:'물놀이 · 산책 · 함께 쉬는 시간',detail:'활동 예약은 날씨와 일행의 컨디션을 확인해 결정해요.'},{title:'시내에서 마무리',date:'9.13–16',nights:'시내 · 3박',stay:'시내 숙소',experiences:'가벼운 관광 · 쇼핑 · 공항 이동',detail:'숙소를 기준으로 식사·휴식·귀국 동선을 연결해요.'}],places:['숙소에서 아침','해변 산책','수상 활동 후보','숙소 저녁 모임'],transit:'거점 이동 · 단체 차량 / 인원·수하물 확인'},
 yunnan:{title:'윈난, 도시 사이의 풍경',code:'YUNNAN',dates:'2025.12.23 — 2026.01.03',day:'12월 27일 토요일',region:'리장',lead:'머무는 도시마다,\n다른 이야기가.',summary:'경유와 도시 간 이동을 먼저 연결하고, 거점마다 핵심 경험과 휴식을 배치해요. 상세 경로는 확인하며 다듬습니다.',blocks:[{title:'경유를 지나 쿤밍·다리로',date:'12.23–26',nights:'경유 · 도시 체류',stay:'이동 거점 숙소',experiences:'도착 · 철도 이동 · 고성 산책',detail:'출발역과 도착역, 숙소 접근 시간을 따로 확인해요.'},{title:'리장에서 머물고 둘러보기',date:'12.26–28',nights:'리장 · 체류',stay:'리장 숙소',experiences:'고성 · 자연경관 후보 · 휴식',detail:'예약·날씨·일행의 컨디션에 따라 대안을 준비해요.'},{title:'다음 거점과 귀로',date:'12.28–1.03',nights:'경유지 선택 필요',stay:'후반 숙소 확인',experiences:'호도협/샹그릴라 후보 · 쿤밍 · 귀로',detail:'원본의 복수 계획안에서 경유지와 교통편을 먼저 선택해요.'}],places:['숙소에서 출발','고성 산책','자연경관 방문 후보','숙소 저녁 모임'],transit:'도시 연결 · 철도/버스 / 표·짐 보관 확인'}
};
let state,returnFocus,toastTimer;
const tripSessions=new Map();
function selectTrip(key){const role=state.role;tripSessions.set(state.key,state);state=tripSessions.get(key)||initial(key,role);state.role=role;state.view=state.essayAccepted?'records':'plan';}
function savedTrip(key){return key===state.key?state:tripSessions.get(key);}
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=value=>JSON.parse(JSON.stringify(value));
const canWrite=()=>state.role!=='viewer';
const minute=time=>Number(time.split(':')[0])*60+Number(time.split(':')[1]);
const clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function initial(key='taiwan',role='coordinator'){
 const trip=scenarios[key];
 return {key,role,view:'plan',block:1,version:1,customTitle:'',pending:null,undo:null,dayConfirmed:false,essay:'',essayAccepted:false,essaySources:[],essayHistory:[],notes:[],tasks:[],activity:[],events:[
 {id:'e1',time:'09:00',title:trip.places[0],duration:30,done:true,locked:false,kind:'departure',detail:'확인된 행동의 예시 · 실제 방문 이력 아님'},
 {id:'e2',time:'13:30',title:trip.places[1],duration:45,done:false,locked:false,kind:'outdoor',detail:'체류 45분 · 다음 이동시간 확인 필요'},
 {id:'e3',time:'15:00',title:trip.places[2],duration:60,done:false,locked:false,kind:'outdoor',detail:'체류 60분 · 운영/입장 조건 확인 필요'},
 {id:'e4',time:'18:00',title:trip.places[3],duration:30,done:false,locked:true,kind:'booking',detail:'시간 고정 예시 · 실제 예약 아님'}]};
}
function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4500);}
function closeSheet(){$('sheet').close();if(returnFocus?.isConnected)returnFocus.focus();}
function openSheet(kicker,title,body,foot){returnFocus=document.activeElement;$('dialog-kicker').textContent=kicker;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-foot').innerHTML=foot;$('sheet').showModal();}
function tripTitle(){return state.customTitle||scenarios[state.key].title;}
function hero(){const t=scenarios[state.key];return `<section class="hero"><div class="hero-copy"><span class="eyebrow">A JOURNEY TO REMEMBER</span><h2>${esc(t.lead).replace('\n','<br>')}</h2><p>${esc(t.summary)}</p></div><div class="hero-illustration" aria-hidden="true"><div class="sun"></div><div class="hill back"></div><div class="hill"></div><div class="town"><div class="house"></div><div class="house"></div><div class="house"></div></div><div class="hero-code">${t.code}</div></div></section>`;}
function intro(){const names={plan:['OUR BIG PLAN','큰 그림부터, 함께.','도시·숙박·꼭 하고 싶은 경험을 먼저 정해요.'],today:['HERE & NOW','오늘의 여행','이미 한 일은 남기고, 앞으로의 계획은 가볍게 바꿔요.'],records:['OUR TRAVEL STORY','작은 순간이, 한 편의 여행으로.','실제로 한 일과 남긴 기록으로 이야기를 엮어요.'],prepare:['READY FOR THE JOURNEY','마음 편한 출발을 위해.','예약·이동·담당 과제를 한곳에서 확인해요.'],library:['A LIFETIME OF JOURNEYS','다녀온 곳보다, 함께한 순간.','지난 여행의 기억이 다음 여행의 시작이 됩니다.']};const n=names[state.view];return `<div class="page-intro"><div><p class="eyebrow">${n[0]}</p><h1>${n[1]}</h1><p class="subtitle">${n[2]}</p></div>${state.view==='plan'?'<button class="btn primary" data-action="brief">＋ 큰 계획 다듬기</button>':state.view==='today'?'<button class="btn gold" data-action="replan">↻ 계획 바꾸기</button>':state.view==='library'?'<button class="btn primary" data-action="brief">＋ 다음 여행 구상</button>':''}</div>`;}
function prepRail(){return `<aside class="rail stack"><section class="card"><p class="eyebrow">BEFORE YOU GO</p><h3 class="rail-title" style="margin-top:8px">먼저 정할 일</h3><ul class="mini-list"><li><div><strong>고정 예약 확인</strong><p>시간·인원·변경 조건을 확인해요</p></div></li><li><div><strong>이동 연결 확인</strong><p>마지막 도보와 짐 보관까지</p></div></li><li><div><strong>일행에게 역할 나누기</strong><p>함께 준비하면 더 가벼워져요</p></div></li></ul><button class="textbtn" data-view="prepare">준비 목록 열기 →</button></section><section class="card soft"><span class="tag amber">계획 도우미</span><h3 style="margin-top:12px">여유를 남겨두세요.</h3><p class="small muted" style="margin-top:9px">먼저 예약을 고정하고, 사이에 하고 싶은 일을 넣어요. 바뀔 수 있는 계획에는 대안을 준비해요.</p><p class="guide-note">시안의 정보는 예시입니다. 실제 조회 결과에는 출처와 확인 시각이 표시됩니다.</p></section></aside>`;}
function planView(){const t=scenarios[state.key];return `<div class="view-layout"><div>${hero()}<div class="section-title"><h2>우리의 큰 계획</h2><span class="small muted">${t.dates}</span></div><div class="block-list">${t.blocks.map((b,i)=>`${i?`<div class="connection">${esc(t.transit)}</div>`:''}<article class="card block-card"><div class="block-top"><span class="block-number">0${i+1}</span><div class="grow"><div class="row spread"><h3>${esc(b.title)}</h3><span class="tag ${i===1?'amber':'outline'}">${i===1?'함께 조정할 구간':'큰 계획 초안'}</span></div><div class="block-meta"><span>${b.date}</span><span>${b.nights}</span><span>⌂ ${esc(b.stay)}</span></div><p>${esc(b.experiences)}</p><p class="small muted" style="margin-top:8px">${esc(b.detail)}</p></div></div><div class="block-bottom"><span class="small muted">${i===1?'◷ 시간 고정 항목 1개 · 예시':'○ 준비 상태 확인 필요'}</span><button class="btn ${i===1?'primary':''}" data-action="block" data-index="${i}">세부 일정 보기 →</button></div></article>`).join('')}</div></div>${prepRail()}</div>`;}
function pendingBanner(){if(!state.pending)return '';return `<div class="notice"><div class="grow"><strong>동행자가 제안한 변경안이 있어요</strong><p>${esc(state.pending.reason)} · 원래 계획은 유지 중</p></div><button class="btn" data-action="review-pending">변경안 보기</button></div>`;}
function todayView(){const t=scenarios[state.key],next=state.events.find(e=>!e.done&&!e.skipped);return `${pendingBanner()}<div class="view-layout"><div class="stack"><div class="row spread"><span class="tag outline">${t.day} · ${esc(t.region)} · 현장 체험 예시</span><span class="small muted">계획 v${state.version}</span></div><section class="card next-card"><span class="eyebrow">${next?'UP NEXT':'DAY COMPLETE'}</span><h2>${next?esc(next.title):'오늘의 순간을 돌아볼까요?'}</h2><p class="muted">${next?`${next.time} 예정 · ${next.locked?'시간 고정':'상황에 따라 조정 가능'}`:'남은 일정이 없어요. 기록에서 하루를 확정할 수 있어요.'}</p><div class="next-actions">${next?`<button class="btn gold" data-action="done" data-id="${next.id}" ${canWrite()?'':'disabled'}>✓ 다녀왔어요</button><button class="btn" data-action="edit" data-id="${next.id}">일정 자세히</button>`:'<button class="btn gold" data-view="records">하루 돌아보기 →</button>'}</div></section><div class="row spread"><h2>오늘의 흐름</h2><button class="textbtn" data-action="replan" ${canWrite()?'':'disabled'}>↻ RePlan</button></div><ol class="timeline">${state.events.map(e=>`<li class="timeline-item"><span class="time">${e.time}</span><article class="event ${e.done?'completed':''}"><div class="event-top"><h3>${esc(e.title)}</h3><span class="tag ${e.done?'done':e.skipped?'outline':e.locked?'amber':'outline'}">${e.done?'✓ 방문 확인':e.skipped?'건너뜀':e.locked?'◷ 시간 고정':'예정'}</span></div><p>${esc(e.detail)}</p>${!e.done&&!e.skipped?`<div class="event-tools"><button class="btn" data-action="edit" data-id="${e.id}">수정</button><button class="btn" data-action="done" data-id="${e.id}" ${canWrite()?'':'disabled'}>다녀왔어요</button>${!e.locked?`<button class="btn ghost" data-action="skip" data-id="${e.id}" ${canWrite()?'':'disabled'}>건너뛰기</button>`:''}</div>`:''}</article></li>`).join('')}</ol><button class="quick-capture" data-action="capture" ${canWrite()?'':'disabled'}>＋ &nbsp; 지금 기억하고 싶은 순간을 남겨보세요</button>${state.undo?'<button class="textbtn" data-action="undo">방금 적용한 계획 되돌리기</button>':''}</div><aside class="rail stack"><section class="card"><span class="eyebrow">TODAY’S ANCHOR</span><h3 style="margin-top:9px">오늘의 기준점</h3><ul class="mini-list"><li><div><strong>18:00 ${esc(t.places[3])}</strong><p>시간 고정 · 변경 전에 확인</p></div></li><li><div><strong>관광 사이 이동</strong><p>소요시간·현지 운영 확인 필요</p></div></li></ul><p class="guide-note">실제 운영에서는 출처와 예약 문서를 이곳에서 엽니다.</p></section><section class="card soft"><h3>지금 상황이 달라졌나요?</h3><p class="small muted" style="margin-top:8px">비·지연·휴식을 반영해 남은 일정의 대안을 비교해요.</p><button class="textbtn" data-action="replan">계획 바꾸기 →</button></section></aside></div>`;}
function recordsView(){const visits=state.events.filter(e=>e.done);return `<div class="view-layout"><div class="stack"><section class="card"><div class="section-title"><div><p class="eyebrow">${scenarios[state.key].day} · 체험 기록</p><h2 style="margin-top:8px">우리가 남긴 하루</h2></div><button class="btn" data-action="capture" ${canWrite()?'':'disabled'}>＋ 순간 기록</button></div>${visits.map(e=>`<div class="record-entry"><span class="tag done">✓ 방문 확인 · 예시</span><h3 style="margin-top:8px">${e.time} · ${esc(e.title)}</h3><p class="small muted">일정에서 확인한 경험 · 참여자: 나</p></div>`).join('')}${state.notes.map(n=>`<div class="record-entry"><span class="tag outline">${n.shared?'동행자와 공유':'나만 보는 기록'}</span><p style="margin-top:8px">${esc(n.text)}</p></div>`).join('')}${!state.notes.length?'<p class="muted small" style="margin-top:18px">아직 한 줄 기록이 없어요. 오늘의 느낌을 짧게 남겨보세요.</p>':''}<div class="rule"></div><div class="row spread"><span class="small muted">${state.dayConfirmed?'✓ 하루 확인 완료':`방문 ${visits.length} · 건너뜀 ${state.events.filter(e=>e.skipped).length} · 미확인 ${state.events.filter(e=>!e.done&&!e.skipped).length}`}</span><button class="btn ${state.dayConfirmed?'':'primary'}" data-action="confirm-day" ${canWrite()?'':'disabled'}>${state.dayConfirmed?'하루 다시 확인':'하루 기록 확정'}</button></div></section><section class="story-sheet"><p class="eyebrow">FROM MOMENTS TO A STORY</p><h2>${state.essayAccepted?'우리가 간직할 이야기':'우리의 여행은 계속됩니다.'}</h2>${state.essay?`<p>${esc(state.essay).replaceAll('\n','<br>')}</p><details class="source-toggle"><summary>초안 생성 당시의 근거 기록</summary><ul>${state.essaySources.map(source=>`<li>${esc(source)}</li>`).join('')}</ul></details><p class="small muted">${state.dayConfirmed?'':'이후 기록이 추가되었어요. 기존 글과 근거는 보존됩니다. 하루를 다시 확정한 뒤 새 초안을 만들 수 있어요.'}</p><div class="row"><button class="btn" data-action="essay" ${canWrite()?'':'disabled'}>현재 기록으로 새 초안</button><button class="btn" data-action="edit-essay" ${canWrite()?'':'disabled'}>글 다듬기</button><button class="btn primary" data-action="accept-essay" ${canWrite()?'':'disabled'}>${state.essayAccepted?'여행장에 보관됨':'여행장에 보관'}</button></div>`:'<p class="muted">확정한 경험과 함께 남긴 메모를 모아<br>우리 여행의 한 장을 만들어보세요.</p><button class="btn primary" style="margin-top:23px" data-action="essay" '+(canWrite()?'':'disabled')+'>✦ 에세이 초안 보기</button>'}${state.essayHistory.length?`<details class="source-toggle"><summary>이전 초안·편집본 ${state.essayHistory.length}개</summary>${state.essayHistory.map((version,i)=>`<div class="record-entry"><strong>보존본 ${i+1}</strong><p>${esc(version.text)}</p><ul>${version.sources.map(source=>`<li>${esc(source)}</li>`).join('')}</ul></div>`).join('')}</details>`:''}<p class="small muted" style="margin-top:17px">시안에서는 확인한 예시 기록을 문장으로 묶습니다. 실제 AI 생성은 연결되지 않았습니다.</p></section></div><aside class="rail stack"><section class="card soft"><p class="eyebrow">OUR MEMORIES</p><div class="fact-count">${visits.length+state.notes.length}<span style="font-size:14px;font-family:sans-serif"> 개의 순간</span></div><p class="small muted">계획에 있던 곳을 자동으로 방문한 곳으로 기록하지 않아요.</p></section><section class="card"><h3>함께 쓸 기록만 선택</h3><p class="small muted" style="margin-top:10px">나만 보는 메모는 공동 에세이에 포함되지 않아요. 원문은 편집본과 따로 보관합니다.</p><button class="textbtn" data-view="library">평생 여행장 보기 →</button></section></aside></div>`;}
const taskData=[['dates','여행·숙박 날짜 확인','항공 기간과 숙박 기간의 일치 여부를 확인해요.','나'],['tickets','사전 티켓·예약 조건 확인','발권 시각·인원·마지막 입장·변경 조건을 확인해요.','동행자 A'],['route','교통 연결 확인','환승·짐 보관·주차·마지막 도보를 함께 확인해요.','동행자 B'],['fund','공금과 개인 지출 나누기','담당자와 비용 분담 기준을 정해요.','나']];
function prepareView(){return `<div class="view-layout"><div class="stack"><section class="notice"><div><strong>계획을 확정하기 전에</strong><p>과거 자료에서 가져온 날짜·요금·운영 조건은 다시 확인해야 해요.</p></div></section><section class="card"><div class="section-title"><h2>함께 준비할 일</h2><span class="small muted">${state.tasks.length} / ${taskData.length} 확인</span></div>${taskData.map(t=>`<div class="task-row"><input type="checkbox" id="task-${t[0]}" data-task="${t[0]}" ${state.tasks.includes(t[0])?'checked':''} ${canWrite()?'':'disabled'}><label for="task-${t[0]}"><strong>${t[1]}</strong><p>${t[2]}</p><span class="tag outline" style="margin-top:8px">담당 ${t[3]}</span></label></div>`).join('')}</section><section class="card"><span class="tag amber">자료 가져오기 설계</span><h2 style="margin-top:12px">날짜가 다르면, 먼저 물어봐요.</h2><p class="small muted" style="margin-top:12px">원본을 조용히 바꾸지 않고, 서로 다른 날짜·장소·통화를 비교한 뒤 선택하게 합니다.</p><button class="textbtn" data-action="import-review">가져오기 비교 예시 보기 →</button></section></div><aside class="rail stack"><section class="card soft"><h3>예약됨 ≠ 방문함</h3><p class="small muted" style="margin-top:10px">예약은 계획의 기준점이에요. 실제 다녀온 기록은 오늘 화면에서 확인합니다.</p></section><section class="card"><h3>지출도 여행의 맥락</h3><p class="small muted" style="margin-top:10px">공금·개인 결제·영수증을 날짜와 장소에 연결합니다. 실제 정산 기능은 후속 구현입니다.</p></section></aside></div>`;}
function libraryView(){return `<section class="hero"><div class="hero-copy"><p class="eyebrow">YOUR LIFE, WELL TRAVELED</p><h2>우리의 여행은<br>한 권씩 쌓여갑니다.</h2><p>계획만 남은 여행도, 완성된 이야기도.<br>연도와 장소를 따라 다시 꺼내보세요.</p></div><div class="hero-illustration" aria-hidden="true"><div class="sun"></div><div class="hill back"></div><div class="hill"></div><div class="town"><div class="house"></div><div class="house"></div></div></div></section><div class="section-title"><h2>참고 여행을 닮은 세 권의 시안</h2><span class="tag outline">실제 방문 이력 아님</span></div><div class="book-grid">${Object.entries(scenarios).map(([key,t])=>`<article class="book"><p class="eyebrow">${t.dates}</p><h2>${esc(savedTrip(key)?.customTitle||t.title)}</h2><p class="small muted">${savedTrip(key)?.essayAccepted?'에세이 편집본을 이 세션에 보관했어요.':'여행 전 계획 → 현장 조정 → 기록으로 이어지는 예시'}</p><button class="btn" data-action="choose-trip" data-key="${key}">${savedTrip(key)?.essayAccepted?'이야기 읽기':'여정 열기'} →</button></article>`).join('')}</div>`;}
function render(){const role=state.role;$('demo-role').value=role;$('trip-select').value=state.key;Array.from($('trip-select').options).forEach(option=>{option.textContent=savedTrip(option.value)?.customTitle||scenarios[option.value].title;});$('intro').innerHTML=intro();$('pending-count').innerHTML=state.pending?'<span class="count">1</span>':'';document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===state.view;b.classList.toggle('active',active);if(b.closest('.tabs')){if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}});$('content').innerHTML=({plan:planView,today:todayView,records:recordsView,prepare:prepareView,library:libraryView}[state.view])();if(role==='viewer')$('content').insertAdjacentHTML('afterbegin','<p class="readonly">열람자 체험 중 · 계획과 공동 기록을 볼 수 있습니다.</p>');$('side-trip').classList.toggle('active',state.view!=='library');$('side-library').classList.toggle('active',state.view==='library');}

let replan={reason:'rain',option:0,base:0,candidates:[],pending:false};
function replanStart(){if(!canWrite())return notify('열람자는 변경안을 만들 수 없어요.');if(!state.events.some(e=>!e.done&&!e.skipped&&!e.locked))return notify('조정할 유연한 일정이 없어요.');replan={reason:'rain',option:0,base:state.version,candidates:[],pending:false};openSheet('REPLAN · 1 / 2','무엇이 달라졌나요?',`<div class="flow-steps"><strong>① 상황 선택</strong><span>→</span><span>② 비교하고 결정</span></div><div class="reason-chips"><button data-reason="rain" class="active">☂ 비가 와요</button><button data-reason="delay">◷ 60분 늦어졌어요</button><button data-reason="rest">☕ 쉬고 싶어요</button></div><div class="rule"></div><h3>남은 일정만 조정해요</h3><p class="muted" style="margin-top:10px">방문 확인한 일정과 18:00 시간 고정 항목은 유지합니다. 새로운 장소의 운영·이동 조건은 실제 사용 전에 확인해야 해요.</p><p class="guide-note">이 화면은 가상 상황 선택입니다. 실제 날씨·교통 정보 조회가 아닙니다.</p>`,`<button class="btn" data-action="close">그대로 둘게요</button><button class="btn primary" data-action="compare">대안 비교하기 →</button>`);}
function makeCandidates(reason){const original=clone(state.events),eligible=original.filter(e=>!e.done&&!e.skipped&&!e.locked),first=eligible[0],last=eligible.at(-1);const a=clone(original),b=clone(original);if(!first)return [];
 if(reason==='rain'){const x=a.find(e=>e.id===first.id);x.title='실내에서 쉬며 머물기';x.detail='실내 대안 예시 · 장소·운영·이동 확인 필요';x.kind='indoor';if(last.id!==first.id)a.find(e=>e.id===last.id).skipped=true;b.find(e=>e.id===first.id).skipped=true;if(last.id!==first.id){b.find(e=>e.id===last.id).title='날씨 확인 후 짧은 산책';b.find(e=>e.id===last.id).detail='날씨와 현지 운영 확인 후 결정';}}
 if(reason==='delay'){for(const e of a){if(!e.done&&!e.skipped&&!e.locked){const shifted=minute(e.time)+60;if(shifted+e.duration>17*60)e.skipped=true;else e.time=clock(shifted);}}b.find(e=>e.id===first.id).skipped=true;}
 if(reason==='rest'){const x=a.find(e=>e.id===first.id);x.title='함께 쉬는 시간';x.duration=60;x.kind='rest';x.detail='휴식 60분 · 선택한 경험은 보류';if(last.id!==first.id){a.find(e=>e.id===last.id).duration=30;a.find(e=>e.id===last.id).detail='짧게 머무르는 대안 · 이동 확인 필요';}b.find(e=>e.id===first.id).skipped=true;}
 const labels={rain:[['실내와 휴식 중심','야외 활동을 보류하고 편하게 머물러요.'],['여지를 남기는 안','한 곳을 건너뛰고 날씨를 보며 결정해요.']],delay:[['남은 시간 순연','고정 시간에 닿는 활동은 보류해요.'],['한 곳 덜, 여유 있게','한 곳을 건너뛰고 나머지 시간을 유지해요.']],rest:[['휴식을 일정으로','휴식을 먼저 넣고 다음 체류를 짧게 해요.'],['다음 행동까지 자유시간','선택한 활동을 보류하고 여유를 남겨요.']]};
 return [a,b].map((events,i)=>({events,title:labels[reason][i][0],desc:labels[reason][i][1]}));}
function diffRows(candidate){return candidate.events.flatMap(e=>{const old=state.events.find(x=>x.id===e.id);if(JSON.stringify(e)===JSON.stringify(old))return [];return [`<div class="diff-row"><span>${esc(old.time)} ${esc(old.title)}</span><span aria-hidden="true">→</span><strong>${e.skipped?'이번에는 보류':esc(e.time)+' '+esc(e.title)}</strong></div>`];}).join('')||'<p class="small muted">이 대안은 현재 계획과 같은 일정입니다.</p>';}
function compareDialog(){if(!replan.candidates.length)replan.candidates=makeCandidates(replan.reason);const c=replan.candidates[replan.option];if(!c)return notify('비교할 남은 일정이 없어요.');const body=`<div class="flow-steps"><span>① 상황 선택</span><span>→</span><strong>② 비교하고 결정</strong></div><div class="option-grid">${replan.candidates.map((o,i)=>`<button class="option ${i===replan.option?'active':''}" data-option="${i}" aria-pressed="${i===replan.option}"><strong>${o.title}</strong><small>${o.desc}</small></button>`).join('')}</div><div class="replan-diff">${diffRows(c)}</div><div class="row" style="margin-top:17px"><span class="tag done">완료 기록 유지</span><span class="tag done">18:00 고정 유지</span><span class="tag amber">이동·비용 확인 필요</span></div><p class="guide-note">여기서 적용하는 것은 계획 초안입니다. 실제 예약 변경·구매는 실행되지 않습니다. ${state.role==='member'?'참여자는 조정자에게 변경안을 제안합니다.':''}</p>`;
 if($('sheet').open){$('dialog-kicker').textContent='REPLAN · 2 / 2';$('dialog-title').textContent='우리에게 맞는 변화를 골라요';$('dialog-body').innerHTML=body;$('dialog-foot').innerHTML=`<button class="btn" data-action="close">기존 계획 유지</button><button class="btn primary" data-action="apply-replan" ${canWrite()?'':'disabled'}>${state.role==='coordinator'?'이 계획으로 변경':'동행자에게 제안'}</button>`;}else openSheet('REPLAN · 2 / 2','우리에게 맞는 변화를 골라요',body,`<button class="btn" data-action="close">기존 계획 유지</button><button class="btn primary" data-action="apply-replan" ${canWrite()?'':'disabled'}>${state.role==='coordinator'?'이 계획으로 변경':'동행자에게 제안'}</button>`);}
function applyReplan(){if(!canWrite())return;if(state.version!==replan.base){closeSheet();return notify('계획이 바뀌었어요. 현재 일정에서 다시 비교해 주세요.');}const chosen=replan.candidates[replan.option];if(state.role==='member'){state.pending={...clone(replan),reason:({rain:'비가 와요',delay:'60분 늦어졌어요',rest:'쉬고 싶어요'}[replan.reason]||replan.reason)};closeSheet();navigate('today');return notify('변경 제안을 만들었어요. 조정자 역할로 바꿔 검토해 보세요.');}state.undo={events:clone(state.events),version:state.version+1};state.events=clone(chosen.events);state.version++;state.pending=null;state.dayConfirmed=false;state.activity.unshift('계획 v'+state.version+' · '+chosen.title);closeSheet();navigate('today');notify('선택한 변경을 적용했어요. 완료 기록과 고정 시간은 유지됩니다.');}
function captureDialog(){if(!canWrite())return;openSheet('CAPTURE A MOMENT','지금, 기억하고 싶은 한 줄',`<form id="capture-form" class="form"><label>순간 기록<textarea name="text" placeholder="장소보다 먼저 떠오르는 순간이 있나요?" maxlength="2000" required></textarea></label><label class="checkrow"><input name="shared" type="checkbox">동행자와 공유할 기록으로 남기기</label><p class="small muted">선택하지 않으면 나만 보는 메모예요. 시안에서는 이 세션에만 남습니다.</p></form>`,`<button class="btn" data-action="close">취소</button><button class="btn primary" form="capture-form" type="submit">순간 남기기</button>`);}
function editEvent(id){const e=state.events.find(x=>x.id===id);if(!e)return;openSheet('PLAN DETAIL',e.locked?'시간이 고정된 일정':'세부 일정 다듬기',`<form id="event-form" class="form"><input type="hidden" name="eventId" value="${e.id}"><label>무엇을 할까요?<input name="title" value="${esc(e.title)}" maxlength="150" required ${e.locked||!canWrite()?'readonly':''}></label><div class="pair"><label>예정 시각<input name="time" type="time" value="${e.time}" required ${e.locked||!canWrite()?'readonly':''}></label><label>머무는 시간(분)<input name="duration" type="number" min="10" max="180" step="5" value="${e.duration}" required ${e.locked||!canWrite()?'readonly':''}></label></div><p class="guide-note">${e.locked?'고정 예약은 이 시안에서 수정할 수 없어요. 실제 제품에서는 예약 영향과 동행자 확인을 거칩니다.':'이 시안은 시간 중복과 고정 예약 전 여유를 검사합니다. 실제 이동시간 확인은 후속입니다.'}</p></form>`,`<button class="btn" data-action="close">닫기</button>${e.locked?'':`<button class="btn primary" form="event-form" type="submit" ${canWrite()?'':'disabled'}>${state.role==='member'?'수정안 제안':'일정 수정'}</button>`}`);}
function companionDialog(){openSheet('TRAVEL TOGETHER','서로의 계획을 이어줘요',`<p class="muted">실제 접속 중인 사람이 아닌 역할 체험입니다.</p><ul class="mini-list"><li><div><strong>나 · ${state.role==='coordinator'?'일정 조정자':state.role==='member'?'참여자':'열람자'}</strong><p>상단의 체험 역할에서 바꿀 수 있어요</p></div></li><li><div><strong>동행자 A · 참여자 예시</strong><p>예약 조건 확인 담당</p></div></li><li><div><strong>동행자 B · 참여자 예시</strong><p>교통 연결 확인 담당</p></div></li></ul><div class="rule"></div><h3>변경 이력</h3>${state.activity.length?state.activity.map(s=>`<p class="small muted" style="margin-top:10px">${esc(s)}</p>`).join(''):'<p class="small muted" style="margin-top:10px">아직 확정된 변경이 없어요.</p>'}${state.pending?'<div class="notice" style="margin-top:18px"><p>검토를 기다리는 변경안 1개</p></div>':''}`,`<button class="btn" data-action="close">닫기</button>${state.pending?'<button class="btn primary" data-action="review-pending">제안 검토하기</button>':''}`);}
function confirmDay(){if(!canWrite())return;const unchecked=state.events.filter(e=>!e.done&&!e.skipped).length;openSheet('CLOSE THE DAY','오늘의 경험을 확인해요',`<p>방문 확인 ${state.events.filter(e=>e.done).length}개 · 건너뜀 ${state.events.filter(e=>e.skipped).length}개 · 미확인 ${unchecked}개</p><p class="guide-note">미확인 항목은 방문으로 바뀌지 않습니다. 확인된 경험만 에세이의 근거가 됩니다.</p>`,`<button class="btn" data-action="close">다시 살펴보기</button><button class="btn primary" data-action="confirm-day-final">확인한 기록으로 확정</button>`);}
function essay(){if(!canWrite())return;if(!state.dayConfirmed){notify('하루 기록을 먼저 확인하고 확정해 주세요.');return confirmDay();}const visits=state.events.filter(e=>e.done),notes=state.notes.filter(n=>n.shared);if(!visits.length&&!notes.length)return notify('에세이에 사용할 확인된 기록이 없어요.');if(state.essay)state.essayHistory.push({text:state.essay,sources:clone(state.essaySources)});state.essay=[tripTitle()+' — '+scenarios[state.key].day,visits.map(e=>`${e.time}, ${e.title}을(를) 기록했다.`).join(' '),...notes.map(n=>'함께 남긴 메모: '+n.text)].filter(Boolean).join('\n\n');state.essaySources=[...visits.map(e=>'방문 확인: '+e.title),...notes.map(n=>'공동 메모: '+n.text)];state.essayAccepted=false;render();notify('확인한 기록으로 예시 초안을 만들었어요.');}
function importReview(){openSheet('IMPORT & REVIEW','서로 다른 정보를 발견했어요',`<p class="muted">실제 참고 자료에서 발견한 날짜 불일치를 익명 예시로 보여줍니다.</p><div class="replan-diff"><div class="diff-row"><span>여행·항공 기간<br>4월 9~12일</span><span>≠</span><strong>숙소 표의 날짜<br>4월 19~22일</strong></div></div><p class="guide-note">원본 좌표와 값을 함께 보여주고 사용자가 확인합니다. 시안에서는 실제 파일을 가져오거나 날짜를 고치지 않습니다.</p><div class="rule"></div><h3>추가로 확인할 항목</h3><ul class="mini-list"><li><div><strong>다른 지역의 교통 메모</strong><p>이 여행의 항목인지 선택</p></div></li><li><div><strong>서로 다른 동선 제안</strong><p>한 일정에 합치지 않고 대안으로 비교</p></div></li></ul>`,`<button class="btn primary" data-action="close">확인했어요</button>`);}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.reason){replan.reason=b.dataset.reason;document.querySelectorAll('[data-reason]').forEach(x=>x.classList.toggle('active',x===b));return;}if(b.dataset.option!==undefined){replan.option=Number(b.dataset.option);compareDialog();return;}const action=b.dataset.action;
 if(action==='close')return closeSheet();if(action==='reset'){if($('sheet').open)closeSheet();state=initial(state.key,state.role);tripSessions.set(state.key,state);render();return notify('체험 내용을 초기화했어요.');}
 if(action==='brief')return briefDialog();if(action==='block')return blockDetail(Number(b.dataset.index));if(action==='block-today'){closeSheet();return navigate('today');}if(action==='block-prep'){closeSheet();return navigate('prepare');}
 if(action==='replan')return replanStart();if(action==='compare')return compareDialog();if(action==='apply-replan')return applyReplan();
 if(action==='review-pending'){if(!state.pending)return;replan=clone(state.pending);replan.pending=true;if($('sheet').open)closeSheet();return compareDialog();}
 if(action==='undo'){if(state.undo?.version!==state.version)return notify('이후 변경이 있어 바로 되돌릴 수 없어요.');state.events=clone(state.undo.events);state.version++;state.undo=null;state.activity.unshift('계획 v'+state.version+' · 이전 변경 되돌림');render();return notify('앞선 계획으로 되돌렸어요.');}
 if(action==='capture')return captureDialog();if(action==='edit')return editEvent(b.dataset.id);if(action==='companions')return companionDialog();
 if(action==='done'||action==='skip'){if(!canWrite())return;const e=state.events.find(x=>x.id===b.dataset.id);if(!e||e.done)return;e.done=action==='done';e.skipped=action==='skip';state.version++;state.undo=null;state.dayConfirmed=false;render();return notify(action==='done'?'방문 확인을 기록했어요. 한 줄 메모도 남겨보세요.':'건너뛴 일정으로 남겼어요. 방문 기록에는 포함하지 않아요.');}
 if(action==='confirm-day')return confirmDay();if(action==='confirm-day-final'){state.dayConfirmed=true;closeSheet();render();return notify('확인된 경험으로 하루를 확정했어요.');}if(action==='essay')return essay();
 if(action==='edit-essay')return openSheet('EDIT OUR STORY','우리의 말로 다듬어요',`<form id="essay-form" class="form"><label>에세이 편집본<textarea name="essay" rows="10" maxlength="5000" required>${esc(state.essay)}</textarea></label><p class="small muted">원래 순간 기록은 별도로 남아 있어요.</p></form>`,`<button class="btn" data-action="close">취소</button><button class="btn primary" form="essay-form" type="submit">편집본 저장</button>`);
 if(action==='accept-essay'){if(!canWrite())return;state.essayAccepted=true;render();return notify('이 세션의 여행장에 편집본을 보관했어요.');}
 if(action==='choose-trip'){selectTrip(b.dataset.key);return render();}if(action==='import-review')return importReview();
});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='demo-role'){state.role=t.value;render();return;}if(t.id==='trip-select'){selectTrip(t.value);render();return;}if(t.dataset.task&&canWrite()){state.tasks=t.checked?[...new Set([...state.tasks,t.dataset.task])]:state.tasks.filter(x=>x!==t.dataset.task);render();}});
document.addEventListener('submit',event=>{event.preventDefault();if(!canWrite())return;const f=event.target,d=new FormData(f);if(f.id==='brief-form'){const key=d.get('scenario'),title=String(d.get('title')).trim();if(!title)return;selectTrip(key);state.view='plan';state.customTitle=title;state.activity.push('큰 계획 초안 생성'+(d.get('wish')?' · '+String(d.get('wish')):''));closeSheet();render();notify('선택한 흐름으로 큰 계획 초안을 만들었어요.');}
 if(f.id==='capture-form'){const text=String(d.get('text')).trim();if(!text)return;state.notes.push({text,shared:d.has('shared')});state.dayConfirmed=false;closeSheet();navigate('records');notify('한 줄 기록을 남겼어요.');}
 if(f.id==='event-form'){const e=state.events.find(x=>x.id===d.get('eventId'));if(!e||e.locked)return;const title=String(d.get('title')).trim(),time=String(d.get('time')),duration=Number(d.get('duration'));const end=minute(time)+duration;if(!title||!/^\d{2}:\d{2}$/.test(time)||duration<10||duration>180)return;if(end>17*60+30)return notify('18시 고정 일정 전에 30분 여유를 남겨 주세요.');const overlap=state.events.some(x=>x.id!==e.id&&!x.skipped&&minute(time)<minute(x.time)+x.duration&&end>minute(x.time));if(overlap)return notify('다른 일정과 시간이 겹쳐요. 시작 시각을 조정해 주세요.');const next=clone(state.events);Object.assign(next.find(x=>x.id===e.id),{title,time,duration,detail:'수동 조정 · 실제 이동시간 확인 필요'});next.sort((a,b)=>minute(a.time)-minute(b.time));if(state.role==='member'){state.pending={reason:'세부 일정 수정',base:state.version,option:0,candidates:[{events:next,title:'수동 수정안',desc:'제안한 시각과 내용으로 바꿔요.'}],pending:true};}else{state.undo={events:clone(state.events),version:state.version+1};state.events=next;state.version++;state.activity.unshift('계획 v'+state.version+' · 세부 일정 수정');}state.dayConfirmed=false;closeSheet();render();notify(state.role==='member'?'수정안을 제안했어요.':'세부 일정을 수정했어요.');}
 if(f.id==='essay-form'){state.essayHistory.push({text:state.essay,sources:clone(state.essaySources)});state.essay=String(d.get('essay')).trim();state.essayAccepted=false;closeSheet();render();notify('에세이 편집본을 저장했어요. 원문은 유지됩니다.');}
});
$('sheet').addEventListener('cancel',()=>{if(returnFocus?.isConnected)returnFocus.focus();});
state=initial();render();
</script>
</body>
</html>
